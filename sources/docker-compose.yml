# DartMetrics - Basis für alle Umgebungen (Produktion, z. B. Raspberry Pi).
#
#   Entwicklung (PC):  docker compose up -d
#                      -> lädt automatisch docker-compose.override.yml (Ports, Mailpit, Swagger)
#   Produktion (Pi):   COMPOSE_FILE=docker-compose.yml in der .env setzen, dann docker compose up -d
#                      -> nur die Web-App ist von außen erreichbar; MySQL und API nur im Docker-Netz
#
# Alle Variablen: siehe .env.example

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt in .env}
      MYSQL_DATABASE: DartContextDb
      MYSQL_USER: dartforge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt in .env}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      # Über TCP (127.0.0.1) und mit dem App-Benutzer prüfen: Beim allerersten Start läuft MySQL erst als
      # temporärer Server ohne Netzwerk (Initialisierung). "localhost" ginge über den Socket und meldete zu früh
      # "healthy" -> die API startete vor der fertigen Datenbank und brach ab.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u dartforge -p\"$${MYSQL_PASSWORD}\" -e 'SELECT 1' DartContextDb >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # DartMetrics API (Web.Core) - nur intern erreichbar (http://api:8080), die Web-App ist der einzige Zugang (BFF)
  api:
    build:
      context: .
      dockerfile: Web.Core/Dockerfile
    image: dartmetrics-api:dev
    container_name: dartmetrics-api
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    # ML-Daten (Datensätze, Modelle) vom Host: Tools.BotTrainer schreibt nach ./ml_data, die API liest nur.
    volumes:
      - ./ml_data:/data/ml:ro

    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      DartBot__Ml__Path: /data/ml

      # Container network: host "mysql", not localhost
      ConnectionStrings__DartContext: "server=mysql;port=3306;database=DartContextDb;user=dartforge;password=${MYSQL_PASSWORD}"

      Jwt__Key: ${JWT_KEY:?JWT_KEY fehlt in .env}
      Jwt__Issuer: DartMetrics
      Jwt__Audience: DartMetrics
      Jwt__ExpireMinutes: "30"
      Jwt__RefreshTokenExpireDays: "60"

      AdminUser__FirstName: Admin
      AdminUser__LastName: User
      AdminUser__EmailAddress: ${ADMIN_EMAIL:-admin@dart.local}
      AdminUser__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt in .env}

      # Echter SMTP-Server (in der Entwicklung überschreibt docker-compose.override.yml das mit Mailpit)
      Email__SmtpServer: ${SMTP_SERVER:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@dart.local}
      Email__EnableSsl: ${SMTP_ENABLE_SSL:-true}

      # Base URL of the Blazor web app - used for the links in e-mails (verify, login)
      Server__Host: ${WEB_APP_HOST:-https://localhost}
      Server__Port: ${WEB_APP_PORT:-7254}

      # Löschfristen (Datenschutz): unbestätigte Registrierungen / Log-Einträge
      DataRetention__UnverifiedAccountDays: ${RETENTION_UNVERIFIED_DAYS:-7}
      DataRetention__LogMessageDays: ${RETENTION_LOG_DAYS:-90}

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # DartMetrics Web-App (Blazor, Web.App) - https://localhost:7254
  # Benötigt ein HTTPS-Zertifikat unter ./certs/dartmetrics.pfx (Cookie "__Host-" verlangt HTTPS).
  web:
    build:
      context: .
      dockerfile: Web.App/Dockerfile
    image: dartmetrics-web:dev
    container_name: dartmetrics-web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "7254:7254"   # HTTPS
      - "5123:5123"   # HTTP (leitet auf HTTPS um)

    volumes:
      - ./certs:/https:ro
      - web_dataprotection:/home/app/.aspnet/DataProtection-Keys

    environment:
      ASPNETCORE_ENVIRONMENT: ${WEB_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "5123"
      ASPNETCORE_HTTPS_PORTS: "7254"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/dartmetrics.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${CERT_PASSWORD:?CERT_PASSWORD fehlt in .env}

      # Container network: API via service name, not localhost
      ApiHttpClientOptions__ApiBaseUrl: http://api
      ApiHttpClientOptions__Port: "8080"

      # Hinter einem Reverse Proxy / Tunnel (Caddy, Cloudflare Tunnel) auf true setzen
      ForwardedHeaders__Enabled: ${FORWARDED_HEADERS_ENABLED:-false}

      # Brute-Force-Schutz für Login, Registrierung, Passwort-Reset (Anfragen je IP und Zeitfenster)
      RateLimiting__Auth__PermitLimit: ${RATE_LIMIT_AUTH_PERMITS:-10}
      RateLimiting__Auth__WindowSeconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}

      # Impressum / Datenschutz: Angaben zum Betreiber (nicht im Repository, nur in der .env)
      Legal__Name: ${LEGAL_NAME:-}
      Legal__Street: ${LEGAL_STREET:-}
      Legal__City: ${LEGAL_CITY:-}
      Legal__Country: ${LEGAL_COUNTRY:-Deutschland}
      Legal__Email: ${LEGAL_EMAIL:-}
      Legal__Phone: ${LEGAL_PHONE:-}
      # Gleiche Löschfristen wie in der API, damit die Datenschutzerklärung stimmt
      Legal__UnverifiedAccountDays: ${RETENTION_UNVERIFIED_DAYS:-7}
      Legal__LogMessageDays: ${RETENTION_LOG_DAYS:-90}

  # Werkzeug: DartBot-Zielwahl-Modell erzeugen, trainieren, vergleichen, aktivieren (Tools.BotTrainer).
  # Startet NICHT mit "docker compose up" (Profil "tools"), sondern nur gezielt:
  #   docker compose --profile tools run --rm bottrainer generate --situations 1000
  # Komplett automatisch: deploy/train-model.ps1 / .sh
  bottrainer:
    build:
      context: .
      dockerfile: Tools.BotTrainer/Dockerfile
    image: dartmetrics-bottrainer:dev
    profiles: ["tools"]

    depends_on:
      mysql:
        condition: service_healthy

    # Gleicher Ordner wie bei der API (dort schreibgeschützt): Datensätze und Modelle bleiben auf dem Host.
    volumes:
      - ./ml_data:/data/ml

    environment:
      # SslMode=Disabled: nur im internen Docker-Netz. Unter Volllast lief sonst der TLS-Handshake in einen Timeout,
      # dessen Callback den Prozess beendet hat (MySql.Data, StartSSLAsync).
      ConnectionStrings__DartContext: "server=mysql;port=3306;database=DartContextDb;user=dartforge;password=${MYSQL_PASSWORD};SslMode=Disabled"
      MlData__Path: /data/ml
      BOTTRAINER_COMMIT: ${BOTTRAINER_COMMIT:-}

  # Dauerbetrieb: arbeitet die Trainingsaufträge aus dem Admin-Bereich ab (/admin/models).
  # Gleiches Image wie bottrainer; ohne Auftrag prüft er nur alle 10 s die Datenbank.
  bottrainer-worker:
    image: dartmetrics-bottrainer:dev
    command: ["worker"]
    restart: unless-stopped
    # Training belegt die CPU; die API soll daneben spielbar bleiben (auf dem Raspberry Pi ggf. kleiner wählen).
    cpus: ${BOTTRAINER_CPUS:-2}
    stop_grace_period: 30s

    # Die API spielt die Migrationen ein; erst danach gibt es die Tabelle DartBotTrainingJobs.
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy

    volumes:
      - ./ml_data:/data/ml

    environment:
      # SslMode=Disabled: nur im internen Docker-Netz. Unter Volllast lief sonst der TLS-Handshake in einen Timeout,
      # dessen Callback den Prozess beendet hat (MySql.Data, StartSSLAsync).
      ConnectionStrings__DartContext: "server=mysql;port=3306;database=DartContextDb;user=dartforge;password=${MYSQL_PASSWORD};SslMode=Disabled"
      MlData__Path: /data/ml
      BOTTRAINER_COMMIT: ${BOTTRAINER_COMMIT:-}

volumes:
  mysql_data:
  web_dataprotection:
