name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What do you want to do that DartMetrics does not support yet?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work? Mock-ups or examples from other darts apps are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Training / game modes
        - Bots / ML
        - Tournaments
        - Statistics
        - Administration
        - Deployment / self-hosting
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself
